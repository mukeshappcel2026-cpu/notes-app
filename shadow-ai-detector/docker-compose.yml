version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  setup-tables:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    entrypoint: /bin/sh
    command: >
      -c "
      sleep 2 &&
      for TABLE in ShadowAI_Findings ShadowAI_Registry ShadowAI_Allowlist ShadowAI_Tenants; do
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name $$TABLE \
          --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
          --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          2>/dev/null || echo \"$$TABLE already exists\";
      done
      "

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      setup-tables:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_FINDINGS_TABLE: ShadowAI_Findings
      DYNAMODB_REGISTRY_TABLE: ShadowAI_Registry
      DYNAMODB_ALLOWLIST_TABLE: ShadowAI_Allowlist
      DYNAMODB_TENANTS_TABLE: ShadowAI_Tenants
